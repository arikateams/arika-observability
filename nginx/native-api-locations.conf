# Copy these locations into the existing api.arika.com.ng server block.
# They are intentionally limited to requests originating on the server itself.
location = /metrics {
    allow 127.0.0.1;
    allow ::1;
    deny all;

    proxy_pass http://127.0.0.1:3001/metrics;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
}

location = /nginx_status {
    stub_status;
    access_log off;

    allow 127.0.0.1;
    allow ::1;
    deny all;
}
